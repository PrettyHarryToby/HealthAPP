{% extends "base.html" %}

{% block title %}Patient portal sign in · Avenara{% endblock %}

{% block content %}
<section class="card" style="max-width: 460px; margin: 8vh auto;">
    <a class="btn btn-back" href="{{ url_for('index') }}"><i class="fas fa-arrow-left"></i> Back to home</a>
    <p class="eyebrow"><i class="fas fa-user-shield"></i> Patient portal</p>
    <h2 style="margin: 8px 0 4px;">Welcome back</h2>
    <p style="color: var(--muted); margin: 0 0 22px;">Sign in to view your own health records.</p>
    <form method="POST" autocomplete="on">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="email" name="email" autocomplete="username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" name="password" autocomplete="current-password" required>
        </div>
        <button class="btn" type="submit"><i class="fas fa-lock"></i> Sign in</button>
    </form>
    <p style="margin: 18px 0 0; color: var(--muted);">New here? <a href="{{ url_for('portal_register') }}" style="color: var(--mint);">Create a verified account</a></p>
</section>
{% endblock %}
